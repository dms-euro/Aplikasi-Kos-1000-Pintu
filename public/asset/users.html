<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Account · Kosan优雅</title>
    <!-- Tailwind CDN v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Flowbite CSS & JS (untuk modal) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-indigo-50/20">

<div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR (sama seperti dashboard) -->
    <aside class="w-64 bg-white shadow-lg flex flex-col justify-between border-r border-indigo-100">
        <div class="py-6 px-4">
            <div class="flex items-center gap-2 mb-8 px-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center shadow-sm">
                    <i class='bx bx-home-alt-2 text-white text-lg'></i>
                </div>
                <span class="text-xl font-semibold text-gray-800">Kos<span class="text-indigo-600">an</span></span>
                <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full ml-1">owner</span>
            </div>
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-indigo-50/50 rounded-xl transition group">
                    <i class='bx bxs-dashboard text-xl text-indigo-400 group-hover:text-indigo-500'></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-indigo-50/50 rounded-xl transition group">
                    <i class='bx bx-building-house text-xl text-emerald-400 group-hover:text-emerald-500'></i>
                    <span>Properti kos</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-indigo-700 bg-indigo-50 rounded-xl border-l-4 border-indigo-600 font-medium">
                    <i class='bx bx-group text-xl text-indigo-600'></i>
                    <span>Management Account</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-indigo-50/50 rounded-xl transition group">
                    <i class='bx bx-receipt text-xl text-amber-400 group-hover:text-amber-500'></i>
                    <span>Tagihan</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-indigo-50/50 rounded-xl transition group">
                    <i class='bx bx-calendar-check text-xl text-rose-400 group-hover:text-rose-500'></i>
                    <span>Penyewaan</span>
                </a>
                <div class="pt-4 mt-2 border-t border-indigo-100"></div>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-indigo-50/50 rounded-xl transition group">
                    <i class='bx bx-cog text-xl text-violet-400 group-hover:text-violet-500'></i>
                    <span>Pengaturan</span>
                </a>
            </nav>
        </div>
        <div class="border-t border-indigo-100 p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-r from-indigo-400 to-emerald-400 flex items-center justify-center text-white font-bold shadow-sm">
                <i class='bx bx-user-circle text-2xl'></i>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-800">Rahma W.</p>
                <p class="text-xs text-indigo-500 flex items-center gap-1"><i class='bx bx-crown text-xs'></i> owner</p>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto bg-white/70 backdrop-blur-sm">
        <!-- top bar -->
        <header class="bg-white border-b border-indigo-100 py-4 px-6 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-semibold text-gray-800">Management <span class="text-indigo-600">Account</span></h1>
                <span class="bg-emerald-100 text-emerald-700 text-sm px-3 py-1 rounded-full flex items-center gap-1"><i class='bx bx-user-check'></i> 12 total users</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative hidden md:block">
                    <i class='bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-indigo-300 text-lg'></i>
                    <input type="text" placeholder="Cari user..." class="pl-10 pr-4 py-2 border border-indigo-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 bg-indigo-50/30 w-64">
                </div>
                <button class="relative p-2 text-indigo-500 hover:bg-indigo-100 rounded-full">
                    <i class='bx bx-bell text-2xl'></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full border border-white"></span>
                </button>
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-200 to-emerald-200 flex items-center justify-center text-indigo-700 font-medium border-2 border-white shadow-sm">
                    <i class='bx bx-user text-xl'></i>
                </div>
            </div>
        </header>

        <!-- konten management account -->
        <div class="p-6">
            <!-- header + button tambah user (trigger modal) -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2"><i class='bx bx-group text-indigo-500'></i> Daftar Pengguna</h2>
                <button id="createUserBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2 transition shadow-sm" data-modal-target="userModal" data-modal-toggle="userModal" onclick="openCreateModal()">
                    <i class='bx bx-plus-circle'></i> Tambah User
                </button>
            </div>

            <!-- Tabel User (sesuai struktur: id, nama, email, role, timestamps) -->
            <div class="bg-white rounded-2xl border border-indigo-100 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-indigo-50/70 text-indigo-800">
                            <tr>
                                <th class="px-6 py-3 text-left font-medium">ID</th>
                                <th class="px-6 py-3 text-left font-medium">Nama</th>
                                <th class="px-6 py-3 text-left font-medium">Email</th>
                                <th class="px-6 py-3 text-left font-medium">Role</th>
                                <th class="px-6 py-3 text-left font-medium">Created At</th>
                                <th class="px-6 py-3 text-left font-medium">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-indigo-100" id="userTableBody">
                            <!-- data akan diisi via javascript -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-3 border-t border-indigo-100 text-right text-xs text-indigo-400">
                    total <span id="userCount">0</span> pengguna
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL FLOWBITE (untuk create & edit) - hidden by default -->
<div id="userModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-2xl shadow-lg border border-indigo-100">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b border-indigo-100 rounded-t-2xl">
                <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2" id="modalTitle">
                    <i class='bx bx-user-plus text-indigo-600'></i> Tambah User
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-indigo-100 hover:text-indigo-700 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center" data-modal-hide="userModal">
                    <i class='bx bx-x text-2xl'></i>
                </button>
            </div>
            <!-- Modal body form -->
            <div class="p-4 md:p-5">
                <form id="userForm" class="space-y-4">
                    <input type="hidden" id="userId" name="userId" value="">

                    <div>
                        <label for="nama" class="block mb-2 text-sm font-medium text-gray-700 flex items-center gap-1"><i class='bx bx-user text-indigo-400'></i> Nama Lengkap</label>
                        <input type="text" name="nama" id="nama" class="bg-indigo-50/30 border border-indigo-200 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="Masukkan nama" required>
                    </div>

                    <div>
                        <label for="email" class="block mb-2 text-sm font-medium text-gray-700 flex items-center gap-1"><i class='bx bx-envelope text-indigo-400'></i> Email</label>
                        <input type="email" name="email" id="email" class="bg-indigo-50/30 border border-indigo-200 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="nama@email.com" required>
                    </div>

                    <div id="passwordFieldContainer">
                        <label for="password" class="block mb-2 text-sm font-medium text-gray-700 flex items-center gap-1"><i class='bx bx-lock-alt text-indigo-400'></i> Password</label>
                        <input type="password" name="password" id="password" class="bg-indigo-50/30 border border-indigo-200 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="••••••••" required>
                    </div>

                    <div>
                        <label for="role" class="block mb-2 text-sm font-medium text-gray-700 flex items-center gap-1"><i class='bx bx-badge-check text-indigo-400'></i> Role</label>
                        <select id="role" name="role" class="bg-indigo-50/30 border border-indigo-200 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" required>
                            <option value="" disabled selected>Pilih role</option>
                            <option value="owner">Owner</option>
                            <option value="staf">Staf</option>
                            <option value="penghuni">Penghuni</option>
                        </select>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-xl text-sm px-5 py-2.5 text-center transition">Simpan</button>
                        <button type="button" data-modal-hide="userModal" class="w-full text-indigo-600 bg-white border border-indigo-200 hover:bg-indigo-50 focus:ring-4 focus:outline-none focus:ring-indigo-100 font-medium rounded-xl text-sm px-5 py-2.5 text-center transition">Batal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Hapus (Delete Confirmation) -->
<div id="deleteModal" tabindex="-1" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-2xl shadow-lg border border-rose-100">
            <div class="p-4 md:p-5 text-center">
                <i class='bx bx-error-circle text-rose-500 text-6xl mb-3'></i>
                <h3 class="mb-5 text-lg font-normal text-gray-700">Apakah Anda yakin ingin menghapus user <span id="deleteUserName" class="font-semibold text-indigo-600"></span>?</h3>
                <div class="flex justify-center gap-3">
                    <button id="confirmDeleteBtn" type="button" class="text-white bg-rose-600 hover:bg-rose-700 focus:ring-4 focus:outline-none focus:ring-rose-200 font-medium rounded-xl text-sm px-5 py-2.5 text-center transition">Ya, hapus</button>
                    <button data-modal-hide="deleteModal" type="button" class="text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-gray-100 font-medium rounded-xl text-sm px-5 py-2.5 text-center transition">Batal</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Simple JavaScript untuk mengelola data dan modal -->
<script>
    // Data dummy awal sesuai struktur tabel
    let users = [
        { id: 1, nama: 'Rahma Wijaya', email: 'rahma@kosan.id', password: 'hidden', role: 'owner', created_at: '2024-01-15' },
        { id: 2, nama: 'Budi Santoso', email: 'budi@kosan.id', password: 'hidden', role: 'staf', created_at: '2024-02-20' },
        { id: 3, nama: 'Siti Aminah', email: 'siti@kosan.id', password: 'hidden', role: 'penghuni', created_at: '2024-03-10' },
        { id: 4, nama: 'Ahmad Fauzi', email: 'ahmad@kosan.id', password: 'hidden', role: 'penghuni', created_at: '2024-03-15' },
        { id: 5, nama: 'Dewi Lestari', email: 'dewi@kosan.id', password: 'hidden', role: 'staf', created_at: '2024-04-01' }
    ];

    let currentDeleteId = null;

    // Render tabel
    function renderTable() {
        const tbody = document.getElementById('userTableBody');
        const userCountSpan = document.getElementById('userCount');

        if (users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500"><i class='bx bx-folder-open text-4xl text-indigo-300 mb-2'></i><br>Tidak ada data user</td></tr>`;
            userCountSpan.textContent = '0';
            return;
        }

        let html = '';
        users.forEach(user => {
            // badge role berdasarkan warna
            let roleBadge = '';
            if (user.role === 'owner') roleBadge = '<span class="bg-violet-100 text-violet-700 text-xs px-2 py-1 rounded-full flex items-center gap-1 w-fit"><i class=\'bx bx-crown\'></i> Owner</span>';
            else if (user.role === 'staf') roleBadge = '<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-1 rounded-full flex items-center gap-1 w-fit"><i class=\'bx bx-user-pin\'></i> Staf</span>';
            else if (user.role === 'penghuni') roleBadge = '<span class="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded-full flex items-center gap-1 w-fit"><i class=\'bx bx-home\'></i> Penghuni</span>';

            html += `<tr>
                <td class="px-6 py-4 text-gray-600 font-mono text-xs">${user.id}</td>
                <td class="px-6 py-4 font-medium text-gray-800 flex items-center gap-2"><i class='bx bx-user-circle text-indigo-400 text-lg'></i> ${user.nama}</td>
                <td class="px-6 py-4 text-gray-600">${user.email}</td>
                <td class="px-6 py-4">${roleBadge}</td>
                <td class="px-6 py-4 text-gray-500 text-xs">${user.created_at}</td>
                <td class="px-6 py-4">
                    <div class="flex items-center gap-2">
                        <button onclick="openEditModal(${user.id})" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-lg transition" title="Edit">
                            <i class='bx bx-edit-alt'></i>
                        </button>
                        <button onclick="openDeleteModal(${user.id}, '${user.nama}')" class="text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 p-2 rounded-lg transition" title="Hapus">
                            <i class='bx bx-trash'></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
        userCountSpan.textContent = users.length;
    }

    // Modal handlers
    function openCreateModal() {
        document.getElementById('modalTitle').innerHTML = `<i class='bx bx-user-plus text-indigo-600'></i> Tambah User`;
        document.getElementById('userForm').reset();
        document.getElementById('userId').value = '';
        document.getElementById('passwordFieldContainer').style.display = 'block';
        document.getElementById('password').required = true;
        // Trigger Flowbite modal show
        const modal = document.getElementById('userModal');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
    }

    function openEditModal(userId) {
        const user = users.find(u => u.id === userId);
        if (!user) return;

        document.getElementById('modalTitle').innerHTML = `<i class='bx bx-edit text-indigo-600'></i> Edit User`;
        document.getElementById('userId').value = user.id;
        document.getElementById('nama').value = user.nama;
        document.getElementById('email').value = user.email;
        document.getElementById('role').value = user.role;

        // Hide password field (tidak required saat edit, bisa dikosongi)
        document.getElementById('passwordFieldContainer').style.display = 'none';
        document.getElementById('password').required = false;

        const modal = document.getElementById('userModal');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
    }

    function openDeleteModal(userId, userName) {
        currentDeleteId = userId;
        document.getElementById('deleteUserName').textContent = userName;
        const modal = document.getElementById('deleteModal');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
    }

    // Close modal when clicking outside or on close button (manual)
    document.querySelectorAll('[data-modal-hide]').forEach(button => {
        button.addEventListener('click', function() {
            const modalId = this.getAttribute('data-modal-hide');
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
                modal.setAttribute('aria-hidden', 'true');
            }
        });
    });

    // Form submit handler (create / edit)
    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const userId = document.getElementById('userId').value;
        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        if (userId) {
            // EDIT mode
            const index = users.findIndex(u => u.id === parseInt(userId));
            if (index !== -1) {
                users[index].nama = nama;
                users[index].email = email;
                users[index].role = role;
                if (password) {
                    users[index].password = password; // simulasi ganti password
                }
            }
        } else {
            // CREATE mode
            const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;
            const newUser = {
                id: newId,
                nama: nama,
                email: email,
                password: password || 'hidden',
                role: role,
                created_at: new Date().toISOString().split('T')[0] // YYYY-MM-DD
            };
            users.push(newUser);
        }

        // Close modal
        document.getElementById('userModal').classList.add('hidden');
        document.getElementById('userModal').setAttribute('aria-hidden', 'true');

        // Refresh tabel
        renderTable();
    });

    // Delete confirmation
    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        if (currentDeleteId) {
            users = users.filter(u => u.id !== currentDeleteId);
            renderTable();
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').setAttribute('aria-hidden', 'true');
            currentDeleteId = null;
        }
    });

    // Initial render
    renderTable();

    // Utility: close modal on outside click (sederhana)
    window.addEventListener('click', function(e) {
        if (e.target.classList.contains('fixed') && e.target.hasAttribute('aria-hidden')) {
            const modals = document.querySelectorAll('.fixed[aria-hidden="false"]');
            modals.forEach(modal => {
                modal.classList.add('hidden');
                modal.setAttribute('aria-hidden', 'true');
            });
        }
    });
</script>

</body>
</html>
